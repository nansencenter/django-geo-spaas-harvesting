# default configuration file
---
update_vocabularies: True
update_pythesint: True
default_providers:
  # generic providers
  ftp:
    crawler:
      name: ftp
  thredds:
    crawler:
      name: 'thredds'
      config:
        max_threads: 30
  opendap:
    crawler:
      name: 'podaac'
      config:
        max_threads: 30
  http:
    crawler:
      name: 'html_directory'
      config:
        max_threads: 30
  nansat:
    crawler:
      name: 'nansat'
    normalizer:
      name: 'nansat'
  netcdf_lon_lat:
    crawler:
      name: 'netcdf'
      config:
        longitude_attribute: 'lon'
        latitude_attribute: 'lat'
  netcdf_l:
    crawler:
      name: 'netcdf'
      config:
        longitude_attribute: 'longitude'
        latitude_attribute: 'latitude'
  netcdf_L:
    crawler:
      name: 'netcdf'
      config:
        longitude_attribute: 'LONGITUDE'
        latitude_attribute: 'LATITUDE'

  # specific providers
  ceda:
    # ftp://anon-ftp.ceda.ac.uk/neodc/esacci/sst/data/CDR_v2/Climatology/L4/v2.1
    crawler:
      name: 'ftp'
      config:
        include: '\.nc$'
    normalizer:
      name: 'ceda'
  gportal:
    # ftp://ftp.gportal.jaxa.jp/standard/GCOM-W/GCOM-W.AMSR2/L3.SST_25/3
    crawler:
      name: 'ftp'
      config:
        include: '\.h5$'
    normalizer:
      name: 'gportal_gcom'
  metno_osisaf:
    # https://thredds.met.no/thredds
    crawler:
      name: 'thredds'
      config:
        include: '\.nc$'
    normalizer:
      name: 'osisaf'
  aviso:
    # https://tds.aviso.altimetry.fr/thredds
    crawler:
      name: 'thredds'
      config:
        include: '\.nc$'
    normalizer:
      name: 'aviso'
  noaa_hycom:
    # ftp://ftp.opc.ncep.noaa.gov
    # ftp://ftpprd.ncep.noaa.gov
    crawler:
      name: 'ftp'
      config:
        include: '\.nc(\.gz)?$'
    normalizer:
      name: 'noaa_hycom'
  noaa_rtofs:
    # ftp://ftp.opc.ncep.noaa.gov
    # ftp://ftpprd.ncep.noaa.gov
    crawler:
      name: 'ftp'
      config:
        include: '\.nc(\.gz)?$'
    normalizer:
      name: 'noaa_rtofs'
  cpom:
    crawler:
      name: 'netcdf'
      config:
        longitude_attribute: 'lon'
        latitude_attribute: 'lat'
    normalizer:
      name: 'cpom'
  cmems:
    crawler:
      name: 'cmems'
    normalizer:
      name: 'cmems'
  creodias:
    crawler:
      name: 'resto'
      config:
        url: 'https://datahub.creodias.eu'
    normalizer:
      name: 'resto'
  copernicus_data_space:
    crawler:
      name: 'resto'
      config:
        url: 'https://catalogue.dataspace.copernicus.eu'
    normalizer:
      name: 'resto'
  earthdata_cmr:
    crawler:
      name: 'earthdata_cmr'
    normalizer:
      name: 'earthdata_cmr'
  argo_profile:
    normalizer:
      name: 'tabledap'
    crawler:
      name: 'tabledap'
      config:
        url: 'https://erddap.ifremer.fr/erddap/tabledap/ArgoFloats.json'
        entry_id_prefix: 'argo_profile_'
        id_attrs: ['platform_number', 'cycle_number']
        longitude_attr: 'longitude'
        latitude_attr: 'latitude'
        time_attr: 'time'
        position_qc_attr: 'position_qc'
        time_qc_attr: 'time_qc'
        valid_qc_codes: ['1', '2', '8']
        variables:
        - 'platform_number'
        - 'cycle_number'
        - 'pres'
        - 'pres_qc'
        - 'pres_adjusted'
        - 'pres_adjusted_qc'
        - 'pres_adjusted_error'
        - 'temp'
        - 'temp_qc'
        - 'temp_adjusted'
        - 'temp_adjusted_qc'
        - 'temp_adjusted_error'
        - 'psal'
        - 'psal_qc'
        - 'psal_adjusted'
        - 'psal_adjusted_qc'
        - 'psal_adjusted_error'
  argo_trajectory:
    normalizer:
      name: 'tabledap'
    crawler:
      name: 'tabledap'
      config:
        url: 'https://erddap.ifremer.fr/erddap/tabledap/ArgoFloats.json'
        entry_id_prefix: 'argo_trajectory_'
        id_attrs: ['platform_number']
        longitude_attr: 'longitude'
        latitude_attr: 'latitude'
        time_attr: 'time'
        position_qc_attr: 'position_qc'
        time_qc_attr: 'time_qc'
        valid_qc_codes: ['1', '2', '8']
        variables:
        - 'platform_number'
  bioargo_profile:
    normalizer:
      name: 'tabledap'
    crawler:
      name: 'tabledap'
      config:
        url: 'https://erddap.ifremer.fr/erddap/tabledap/ArgoFloats-synthetic-BGC.json'
        entry_id_prefix: 'bioargo_profile_'
        id_attrs: ['platform_number', 'cycle_number']
        longitude_attr: 'longitude'
        latitude_attr: 'latitude'
        time_attr: 'time'
        position_qc_attr: 'position_qc'
        time_qc_attr: 'time_qc'
        valid_qc_codes: ['1', '2', '8']
        variables:
        - 'platform_number'
        - 'cycle_number'
        - 'pres'
        - 'pres_qc'
        - 'pres_adjusted'
        - 'pres_adjusted_qc'
        - 'pres_adjusted_error'
        - 'doxy'
        - 'doxy_qc'
        - 'doxy_adjusted'
        - 'doxy_adjusted_qc'
        - 'chla'
        - 'chla_qc'
        - 'chla_adjusted'
        - 'chla_adjusted_qc'
  bioargo_trajectory:
    normalizer:
      name: 'tabledap'
    crawler:
      name: 'tabledap'
      config:
        url: 'https://erddap.ifremer.fr/erddap/tabledap/ArgoFloats-synthetic-BGC.json'
        entry_id_prefix: 'bioargo_trajectory_'
        id_attrs: ['platform_number']
        longitude_attr: 'longitude'
        latitude_attr: 'latitude'
        time_attr: 'time'
        position_qc_attr: 'position_qc'
        time_qc_attr: 'time_qc'
        valid_qc_codes: ['1', '2', '8']
        variables:
        - 'platform_number'
...